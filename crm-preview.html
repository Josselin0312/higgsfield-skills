<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Higgsfield Skills - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', sans-serif;
            padding: 0;
            min-height: 100vh;
        }

        .wrapper {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 240px;
            background: #1a1a1a;
            border-right: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px 0;
        }

        .sidebar-header {
            padding: 0 20px 30px;
            display: flex;
            align-items: center;
        }

        .sidebar-logo {
            width: 32px;
            height: 32px;
            background: #dc2626;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 16px;
        }

        .sidebar-section {
            margin-bottom: 30px;
            padding: 0;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            color: #999;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
            cursor: pointer;
        }

        .sidebar-item:hover {
            color: #ffffff;
            background: rgba(220, 38, 38, 0.1);
            border-left-color: #dc2626;
        }

        .sidebar-item.active {
            color: #dc2626;
            background: rgba(220, 38, 38, 0.1);
            border-left-color: #dc2626;
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid #2a2a2a;
        }

        .sidebar-user {
            padding: 0 20px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            color: #999;
            font-size: 13px;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            background: #dc2626;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: white;
            font-size: 12px;
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 40px 40px;
        }

        .header {
            margin-bottom: 40px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .subtitle {
            color: #999;
            font-size: 15px;
        }

        .section-content {
            display: none;
        }

        .section-content.active {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            margin-bottom: 50px;
        }

        .stat-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 24px;
            transition: all 0.2s ease;
        }

        .stat-card:hover {
            background: #252525;
            border-color: #dc2626;
        }

        .stat-label {
            color: #999;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .stat-change {
            font-size: 13px;
            color: #dc2626;
        }

        .section {
            margin-bottom: 50px;
        }

        .section-header {
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .skill-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 24px;
        }

        .skill-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .skill-name {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
        }

        .skill-models {
            color: #999;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .skill-status {
            display: inline-block;
            background: rgba(220, 38, 38, 0.2);
            color: #dc2626;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .revenue-table {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #252525;
            padding: 16px 24px;
            text-align: left;
            color: #dc2626;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #2a2a2a;
        }

        td {
            padding: 16px 24px;
            border-bottom: 1px solid #2a2a2a;
            font-size: 14px;
            color: #ffffff;
        }

        tr:hover {
            background: #252525;
        }

        .empty-state {
            text-align: center;
            padding: 80px 24px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            display: block;
        }

        .empty-state-text {
            font-size: 16px;
            color: #999;
        }

        .footer {
            text-align: center;
            margin-top: 80px;
            padding-top: 24px;
            border-top: 1px solid #2a2a2a;
            color: #666;
            font-size: 13px;
        }

        @media (max-width: 1024px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .skills-grid {
                grid-template-columns: repeat(1, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">HF</div>
            </div>

            <div class="sidebar-section">
                <a class="sidebar-item active" data-section="money">
                    <span>Money</span>
                </a>
                <a class="sidebar-item" data-section="generation">
                    <span>Génération</span>
                </a>
                <a class="sidebar-item" data-section="message">
                    <span>Message</span>
                </a>
            </div>

            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="user-avatar">J</div>
                    <span>josselin@</span>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="header">
                <h1 id="section-title">Money</h1>
                <p class="subtitle">Real-time skills management and revenue tracking</p>
            </div>

            <!-- Money Section -->
            <div id="money-section" class="section-content active">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Revenue</div>
                        <div class="stat-value">$0.00</div>
                        <div class="stat-change">→ Ready to track</div>
                    </div>
                </div>
            </div>

            <!-- Génération Section -->
            <div id="generation-section" class="section-content">
                <div class="empty-state">
                    <span class="empty-state-icon">🎨</span>
                    <div class="empty-state-text">Génération content coming soon</div>
                </div>
            </div>

            <!-- Message Section -->
            <div id="message-section" class="section-content">
                <div class="empty-state">
                    <span class="empty-state-icon">💬</span>
                    <div class="empty-state-text">Message content coming soon</div>
                </div>
            </div>

            <div class="footer">
                Higgsfield Skills Dashboard
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.sidebar-item').forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                const section = item.getAttribute('data-section');

                // Update active item
                document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');

                // Update section title
                const titleMap = {
                    'money': 'Money',
                    'generation': 'Génération',
                    'message': 'Message'
                };
                document.getElementById('section-title').textContent = titleMap[section];

                // Show/hide content
                document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active'));
                document.getElementById(section + '-section').classList.add('active');
            });
        });
    </script>
</body>
</html>
