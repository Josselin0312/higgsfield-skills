<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Higgsfield Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-dot"></div>
      <span>Higgsfield Studio</span>
    </div>

    <!-- Influenceurs -->
    <div class="sidebar-section">
      <p class="sidebar-label">Influenceurs</p>
      <div id="inf-nav"></div>
      <button class="add-btn" onclick="openModal('add-inf')">
        <span>+</span> Ajouter
      </button>
    </div>

    <!-- Génération d'image -->
    <div class="sidebar-section" id="gen-section" style="display:none">
      <p class="sidebar-label">Génération d'image</p>
      <div class="gen-nav">
        <button class="gen-nav-item" data-type="instagram" onclick="selectContentType('instagram')">
          <span class="gen-icon">◻</span>
          <div>
            <div class="gen-nav-name">Instagram</div>
            <div class="gen-nav-sub">Carousel 3–4 images</div>
          </div>
        </button>
        <button class="gen-nav-item" data-type="tiktok" onclick="selectContentType('tiktok')">
          <span class="gen-icon">▶</span>
          <div>
            <div class="gen-nav-name">TikTok</div>
            <div class="gen-nav-sub">Carousel 2–6 images</div>
          </div>
        </button>
        <button class="gen-nav-item" data-type="threads" onclick="selectContentType('threads')">
          <span class="gen-icon">⊕</span>
          <div>
            <div class="gen-nav-name">Threads</div>
            <div class="gen-nav-sub">Repost TikTok</div>
          </div>
        </button>
        <button class="gen-nav-item" data-type="histoire" onclick="selectContentType('histoire')">
          <span class="gen-icon">◈</span>
          <div>
            <div class="gen-nav-name">Histoire</div>
            <div class="gen-nav-sub">Séquence narrative</div>
          </div>
        </button>
      </div>
    </div>
  </aside>

  <!-- ── Main ── -->
  <main class="main">

    <!-- Écran vide -->
    <div id="screen-empty" class="screen center-screen">
      <div class="empty-icon">✦</div>
      <h2>Bienvenue sur Higgsfield Studio</h2>
      <p>Commence par ajouter un influenceur</p>
      <button class="btn-primary" onclick="openModal('add-inf')">Ajouter un influenceur</button>
    </div>

    <!-- Écran influenceur (accueil) -->
    <div id="screen-inf" class="screen" style="display:none">
      <div class="top-bar">
        <div class="top-bar-left">
          <div class="inf-avatar" id="top-avatar"></div>
          <div>
            <h1 id="top-name"></h1>
            <p id="top-sub" class="muted"></p>
          </div>
        </div>
      </div>

      <!-- Stats par type -->
      <div class="stats-row" id="inf-stats"></div>

      <!-- Aperçu récent -->
      <div class="section-block">
        <div class="section-header">
          <span class="section-title">Dernières générations</span>
        </div>
        <div id="recent-grid" class="gallery"></div>
        <div id="recent-empty" class="mini-empty" style="display:none">
          <p>Aucune image générée. Choisis un type dans le menu.</p>
        </div>
      </div>
    </div>

    <!-- Écran Génération d'image -->
    <div id="screen-gen" class="screen" style="display:none">
      <div class="top-bar">
        <div class="top-bar-left">
          <div class="content-type-badge" id="ct-badge"></div>
          <div>
            <h1 id="ct-title"></h1>
            <p id="ct-sub" class="muted"></p>
          </div>
        </div>
        <div class="top-bar-right">
          <button class="btn-ghost" onclick="openBulkModal()">Générer en masse</button>
          <button class="btn-primary" onclick="openSingleModal()">+ Nouveau post</button>
        </div>
      </div>

      <!-- Filtres statut -->
      <div class="filter-row">
        <button class="filter active" onclick="setFilter('all',this)">Tout</button>
        <button class="filter" onclick="setFilter('done',this)">Terminé</button>
        <button class="filter" onclick="setFilter('generating',this)">En cours</button>
        <button class="filter" onclick="setFilter('failed',this)">Échec</button>
      </div>

      <!-- Galerie posts -->
      <div id="posts-grid" class="posts-grid"></div>
      <div id="posts-empty" class="center-screen" style="display:none">
        <div class="empty-icon">○</div>
        <p class="muted">Aucun post généré.</p>
        <button class="btn-primary" style="margin-top:16px" onclick="openSingleModal()">+ Nouveau post</button>
      </div>
    </div>

  </main>

  <!-- ── Modal: Ajouter influenceur ── -->
  <div id="modal-add-inf" class="overlay" onclick="closeModal('add-inf')">
    <div class="modal" onclick="event.stopPropagation()">
      <h3>Nouvel influenceur</h3>
      <form onsubmit="submitAddInf(event)">
        <label>Nom *</label>
        <input id="ai-name" type="text" placeholder="Ex: Sophie Martin" required />
        <label>Handle</label>
        <input id="ai-handle" type="text" placeholder="@sophie" />
        <label>Niche</label>
        <input id="ai-niche" type="text" placeholder="Mode, Fitness, Lifestyle…" />
        <label>Notes de style</label>
        <textarea id="ai-style" rows="2" placeholder="Aesthetic, ambiance, références visuelles…"></textarea>
        <div class="modal-actions">
          <button type="button" class="btn-ghost" onclick="closeModal('add-inf')">Annuler</button>
          <button type="submit" class="btn-primary">Créer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── Modal: Générer un post ── -->
  <div id="modal-single" class="overlay" onclick="closeModal('single')">
    <div class="modal modal-lg" onclick="event.stopPropagation()">
      <div class="modal-type-header" id="modal-type-header"></div>
      <h3 id="modal-single-title">Nouveau post</h3>
      <form onsubmit="submitSingle(event)">
        <label>Prompt — décris la scène *</label>
        <textarea id="s-prompt" rows="4" required
          placeholder="Ex: Portrait naturel, lumière dorée, tenue décontractée…"></textarea>
        <div class="two-col">
          <div>
            <label>Nombre d'images</label>
            <select id="s-count"></select>
          </div>
          <div>
            <label>Modèle</label>
            <select id="s-model">
              <option value="soul_2">Soul 2 — Portraits</option>
              <option value="nano_banana_2">Nano Banana 2 — 4K</option>
              <option value="marketing_studio_image">Marketing Studio</option>
            </select>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-ghost" onclick="closeModal('single')">Annuler</button>
          <button type="submit" class="btn-primary">Générer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── Modal: Génération en masse ── -->
  <div id="modal-bulk" class="overlay" onclick="closeModal('bulk')">
    <div class="modal modal-lg" onclick="event.stopPropagation()">
      <div class="modal-type-header" id="modal-bulk-type-header"></div>
      <h3 id="modal-bulk-title">Génération en masse</h3>
      <form onsubmit="submitBulk(event)">
        <label>Prompts <span class="muted">— un par ligne = un post</span></label>
        <textarea id="b-prompts" rows="10" oninput="countBulkPrompts()"
          placeholder="Portrait naturel, fond blanc&#10;Tenue été, plage, coucher de soleil&#10;Close-up, regard caméra…" required></textarea>
        <p id="b-count" class="prompt-count">0 posts</p>
        <div class="two-col">
          <div>
            <label>Images par post</label>
            <select id="b-count-img"></select>
          </div>
          <div>
            <label>Modèle</label>
            <select id="b-model">
              <option value="soul_2">Soul 2 — Portraits</option>
              <option value="nano_banana_2">Nano Banana 2 — 4K</option>
              <option value="marketing_studio_image">Marketing Studio</option>
            </select>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-ghost" onclick="closeModal('bulk')">Annuler</button>
          <button type="submit" class="btn-primary" id="bulk-submit-btn">Lancer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── Viewer image ── -->
  <div id="modal-viewer" class="overlay viewer-overlay" onclick="closeModal('viewer')">
    <button class="viewer-close" onclick="closeModal('viewer')">✕</button>
    <div class="viewer-inner" onclick="event.stopPropagation()">
      <button class="viewer-nav left" onclick="viewerNav(-1)">‹</button>
      <img id="viewer-img" src="" />
      <button class="viewer-nav right" onclick="viewerNav(1)">›</button>
    </div>
    <p id="viewer-counter" class="viewer-counter"></p>
  </div>

  <div id="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
