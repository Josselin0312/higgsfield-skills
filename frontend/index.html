<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Higgsfield Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-dot"></div>
      <span>Studio</span>
    </div>

    <div class="sidebar-section">
      <p class="sidebar-label">Influenceurs</p>
      <div id="inf-nav"></div>
      <button class="add-btn" onclick="openModal('add-inf')">
        <span>+</span> Ajouter
      </button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">

    <!-- Empty state -->
    <div id="screen-empty" class="screen center-screen">
      <div class="empty-icon">✦</div>
      <h2>Bienvenue sur Studio</h2>
      <p>Commence par ajouter un influenceur</p>
      <button class="btn-primary" onclick="openModal('add-inf')">Ajouter un influenceur</button>
    </div>

    <!-- Influencer screen -->
    <div id="screen-inf" class="screen" style="display:none">
      <div class="top-bar">
        <div class="top-bar-left">
          <div class="inf-avatar" id="top-avatar"></div>
          <div>
            <h1 id="top-name"></h1>
            <p id="top-sub" class="muted"></p>
          </div>
        </div>
        <div class="top-bar-right">
          <button class="btn-ghost" onclick="openModal('bulk')">Générer en masse</button>
          <button class="btn-primary" onclick="openModal('generate')">+ Générer</button>
        </div>
      </div>

      <!-- Filter -->
      <div class="filter-row">
        <button class="filter active" onclick="setFilter('all',this)">Tout</button>
        <button class="filter" onclick="setFilter('done',this)">Terminé</button>
        <button class="filter" onclick="setFilter('generating',this)">En cours</button>
        <button class="filter" onclick="setFilter('failed',this)">Échec</button>
      </div>

      <!-- Gallery -->
      <div id="gallery" class="gallery"></div>
      <div id="gallery-empty" class="center-screen" style="display:none">
        <div class="empty-icon" style="font-size:28px">○</div>
        <p class="muted">Aucune image. Lance une génération !</p>
        <button class="btn-primary" style="margin-top:16px" onclick="openModal('generate')">+ Générer</button>
      </div>
    </div>

  </main>

  <!-- ── Modal: Ajouter influenceur ── -->
  <div id="modal-add-inf" class="overlay" onclick="closeModal('add-inf')">
    <div class="modal" onclick="event.stopPropagation()">
      <h3>Nouvel influenceur</h3>
      <form onsubmit="submitAddInf(event)">
        <label>Nom *</label>
        <input id="ai-name" type="text" placeholder="Ex: Sophie Martin" required />
        <label>Handle</label>
        <input id="ai-handle" type="text" placeholder="@sophie" />
        <label>Niche</label>
        <input id="ai-niche" type="text" placeholder="Mode, Fitness, Lifestyle…" />
        <div class="modal-actions">
          <button type="button" class="btn-ghost" onclick="closeModal('add-inf')">Annuler</button>
          <button type="submit" class="btn-primary">Créer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── Modal: Générer ── -->
  <div id="modal-generate" class="overlay" onclick="closeModal('generate')">
    <div class="modal" onclick="event.stopPropagation()">
      <h3>Générer une image</h3>
      <form onsubmit="submitGenerate(event)">
        <label>Prompt *</label>
        <textarea id="g-prompt" rows="4" placeholder="Décris l'image…" required></textarea>
        <div class="two-col">
          <div>
            <label>Format</label>
            <select id="g-ratio">
              <option value="9:16">9:16 — Stories</option>
              <option value="1:1">1:1 — Post carré</option>
              <option value="4:5">4:5 — Portrait</option>
              <option value="16:9">16:9 — Paysage</option>
            </select>
          </div>
          <div>
            <label>Nombre</label>
            <select id="g-count">
              <option value="1">1 image</option>
              <option value="2">2 images</option>
              <option value="4">4 images</option>
            </select>
          </div>
        </div>
        <label>Modèle</label>
        <select id="g-model">
          <option value="soul_2">Soul 2 — Portraits &amp; mode</option>
          <option value="nano_banana_2">Nano Banana 2 — 4K haute qualité</option>
          <option value="marketing_studio_image">Marketing Studio — Produits &amp; ads</option>
        </select>
        <div class="modal-actions">
          <button type="button" class="btn-ghost" onclick="closeModal('generate')">Annuler</button>
          <button type="submit" class="btn-primary">Générer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── Modal: Générer en masse ── -->
  <div id="modal-bulk" class="overlay" onclick="closeModal('bulk')">
    <div class="modal modal-lg" onclick="event.stopPropagation()">
      <h3>Génération en masse</h3>
      <form onsubmit="submitBulk(event)">
        <label>Prompts <span class="muted" style="font-weight:400">— un par ligne</span></label>
        <textarea id="b-prompts" rows="8" oninput="countPrompts()"
          placeholder="Portrait naturel, fond blanc&#10;Tenue été, plage, coucher de soleil&#10;Close-up, lumière studio…" required></textarea>
        <p id="b-count" class="prompt-count">0 prompts</p>
        <div class="two-col">
          <div>
            <label>Format</label>
            <select id="b-ratio">
              <option value="9:16">9:16 — Stories</option>
              <option value="1:1">1:1 — Carré</option>
              <option value="4:5">4:5 — Portrait</option>
              <option value="16:9">16:9 — Paysage</option>
            </select>
          </div>
          <div>
            <label>Images / prompt</label>
            <select id="b-count-per">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="4">4</option>
            </select>
          </div>
        </div>
        <label>Modèle</label>
        <select id="b-model">
          <option value="soul_2">Soul 2 — Portraits &amp; mode</option>
          <option value="nano_banana_2">Nano Banana 2 — 4K haute qualité</option>
          <option value="marketing_studio_image">Marketing Studio — Produits &amp; ads</option>
        </select>
        <div class="modal-actions">
          <button type="button" class="btn-ghost" onclick="closeModal('bulk')">Annuler</button>
          <button type="submit" id="bulk-submit" class="btn-primary">Lancer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── Viewer image ── -->
  <div id="modal-viewer" class="overlay viewer-overlay" onclick="closeModal('viewer')">
    <button class="viewer-close" onclick="closeModal('viewer')">✕</button>
    <img id="viewer-img" src="" onclick="event.stopPropagation()" />
  </div>

  <!-- Toast -->
  <div id="toasts"></div>

  <script src="app.js"></script>
</body>
</html>
